---
- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Allow the Ubuntu user to run Docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true
