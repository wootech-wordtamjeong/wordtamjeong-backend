name: Test, build, and deploy

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'wordtamjeong' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  deploy:
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      github.repository == 'wootech-wordtamjeong/wordtamjeong-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build --file dockerfile --tag "$IMAGE_URI" --tag "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE_URI"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install --yes ansible

      - name: Temporarily allow this runner to use SSH
        id: runner-ip
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP="$(curl --fail --silent --show-error https://checkip.amazonaws.com)"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/wordtamjeong.pem"
          chmod 600 "$HOME/.ssh/wordtamjeong.pem"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          printf '[app]\nwordtamjeong ansible_host=%s ansible_user=ubuntu\n' "$EC2_HOST" > infra/ansible/inventory/hosts.ini

      - name: Deploy with Ansible
        working-directory: infra/ansible
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_BEDROCK_MODEL: ${{ vars.AWS_BEDROCK_MODEL || 'amazon.titan-embed-text-v2:0' }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ENABLE_INTERNAL_SCHEDULER: ${{ vars.ENABLE_INTERNAL_SCHEDULER || 'true' }}
        run: ansible-playbook deploy.yml --private-key "$HOME/.ssh/wordtamjeong.pem"

      - name: Remove temporary runner SSH access
        if: always() && steps.runner-ip.outputs.runner_ip != ''
        env:
          SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.runner_ip }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SECURITY_GROUP_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32"
